<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Польский A1 — Спряжение глаголов</title>

<!-- PWA: установка на домашний экран -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polski">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg1:#f4f1ea;
    --bg2:#eef2f0;
    --card:#ffffff;
    --ink:#26241f;
    --muted:#6b6558;
    --accent:#b3452c;
    --accent2:#2c6b52;
    --line:#e4ddd0;
    --green-bg:#e5f4ea;
    --green-line:#3f9a5f;
    --green-ink:#1e6b3c;
    --red-bg:#fbe9e6;
    --red-line:#c0492f;
    --red-ink:#96331e;
    --amber-bg:#fff3e0;
    --amber-ink:#8a5a12;
    --amber-line:#e0a94a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia','Iowan Old Style',ui-serif,serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink);
    min-height:100vh;
    padding:calc(24px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
            calc(50px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
    touch-action:manipulation;   /* убирает зум по двойному тапу */
  }
  html{touch-action:manipulation;}
  .wrap{max-width:820px;margin:0 auto;}
  header{text-align:center;margin-bottom:16px;}
  header h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:.3px;}
  header p{margin:0;color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif;font-size:.9rem;}
  .badge{
    display:inline-block;background:var(--accent);color:#fff;
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.72rem;
    letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;
    border-radius:20px;margin-bottom:8px;
  }

  /* ---------- start screen ---------- */
  .start-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .start-card h2{
    margin:0 0 6px;
    font-size:1.25rem;
  }
  .start-card .sub{
    font-family:ui-sans-serif,system-ui,sans-serif;
    color:var(--muted);
    font-size:.88rem;
    margin-bottom:22px;
  }
  .stepper{
    display:flex;align-items:center;justify-content:center;gap:18px;
    margin-bottom:8px;
  }
  .stepper button{
    width:44px;height:44px;border-radius:50%;
    background:var(--bg2);border:1px solid var(--line);
    font-size:1.3rem;font-weight:700;color:var(--accent2);
    display:flex;align-items:center;justify-content:center;
    font-family:ui-sans-serif,system-ui,sans-serif;
  }
  .stepper button:hover{background:var(--line);}
  .stepper-value{
    min-width:90px;
    font-size:2.1rem;
    font-weight:700;
    font-family:'Georgia',serif;
    color:var(--ink);
  }
  .stepper-caption{
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:.8rem;color:var(--muted);margin-bottom:22px;
  }
  .quick-chips{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;
  }
  .chip{
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:.82rem;font-weight:600;
    padding:7px 14px;border-radius:20px;
    background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    cursor:pointer;
  }
  .chip.active{
    background:var(--accent2);border-color:var(--accent2);color:#fff;
  }
  .btn-start{
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:1rem;font-weight:700;
    padding:14px 28px;border-radius:12px;border:none;
    background:var(--accent2);color:#fff;cursor:pointer;width:100%;
  }
  .btn-start:active{transform:scale(.98);}

  /* ---------- quiz screen ---------- */
  .toolbar{
    position:sticky;top:0;z-index:5;
    background:rgba(244,241,234,.94);
    backdrop-filter:blur(6px);
    padding:10px 0 12px;
    display:flex;gap:12px;align-items:center;justify-content:space-between;
    font-family:ui-sans-serif,system-ui,sans-serif;
  }
  .test-label{font-size:.9rem;font-weight:700;color:var(--accent2);white-space:nowrap;}
  .score{font-size:.85rem;color:var(--muted);white-space:nowrap;}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 14px;
    margin-top:10px;
  }
  @media (max-width:600px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
    transition:border-color .2s, background .2s;
  }
  .card.correct{background:var(--green-bg);border-color:var(--green-line);}
  .card.wrong{background:var(--red-bg);border-color:var(--red-line);}
  .q-meta{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.7rem;color:var(--muted);
    margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;
  }
  .q-sentence{font-size:1.02rem;line-height:1.6;}
  .verb-hint{color:var(--accent);font-style:italic;font-size:.9rem;}
  input.blank{
    font-family:'Georgia',serif;font-size:1rem;
    border:none;border-bottom:2px solid var(--line);
    background:transparent;padding:2px 4px;width:120px;text-align:center;
    color:var(--ink);outline:none;transition:border-color .15s;
  }
  input.blank:focus{border-bottom-color:var(--accent2);}
  .card.correct input.blank{border-bottom-color:var(--green-line);color:var(--green-ink);font-weight:600;}
  .card.wrong input.blank{border-bottom-color:var(--red-line);color:var(--red-ink);text-decoration:line-through;}
  .feedback{
    margin-top:7px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.8rem;display:none;
    line-height:1.5;
  }
  .card.wrong .feedback{display:block;color:var(--red-ink);}
  .feedback b{font-weight:700;}
  .icon{display:inline-block;width:14px;text-align:center;margin-right:3px;}
  .conj-link{
    color:var(--accent2);
    font-weight:700;
    text-decoration:underline dotted;
    cursor:pointer;
    border:none;
    background:none;
    padding:0;
    font:inherit;
  }
  .conj-link:hover{color:var(--accent);}

  .actions{
    display:flex;gap:10px;padding:16px 0 4px;
  }
  button{
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.95rem;font-weight:600;
    padding:12px 18px;border-radius:10px;border:none;cursor:pointer;
    transition:transform .1s, opacity .15s;
  }
  button:active{transform:scale(.97);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--accent2);color:#fff;flex:1;}
  .btn-next{background:var(--accent);color:#fff;flex:1;display:none;}
  .btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}

  .result-banner{
    text-align:center;font-family:ui-sans-serif,system-ui,sans-serif;
    padding:14px;border-radius:12px;margin-top:14px;display:none;font-size:.95rem;
  }
  .dots{
    display:flex;justify-content:center;gap:6px;margin:14px 0 4px;
    font-family:ui-sans-serif,system-ui,sans-serif;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--line);
    transition:background .2s;
  }
  .dot.active{background:var(--accent2);}
  .dot.done{background:var(--accent);}
  footer{
    text-align:center;font-family:ui-sans-serif,system-ui,sans-serif;
    color:var(--muted);font-size:.76rem;margin-top:18px;
  }

  /* ---------- summary screen ---------- */
  .summary-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 24px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .summary-score{
    text-align:center;
    margin-bottom:8px;
  }
  .radial-wrap{
    position:relative;
    width:168px;height:168px;
    margin:0 auto 6px;
  }
  .radial-wrap svg{
    position:absolute;top:0;left:0;
    transform:rotate(-90deg);
  }
  .radial-track{fill:none;stroke:var(--line);stroke-width:14;}
  .radial-fill{
    fill:none;stroke-width:14;stroke-linecap:round;
    transition:stroke-dashoffset 1.15s cubic-bezier(.4,0,.2,1);
  }
  .radial-fill.great{stroke:var(--green-line);}
  .radial-fill.ok{stroke:var(--amber-line);}
  .radial-fill.low{stroke:var(--red-line);}
  .radial-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .radial-center .big-pct{
    font-size:2.3rem;font-weight:700;font-family:'Georgia',serif;line-height:1;
  }
  .radial-center .big-pct.great{color:var(--green-ink);}
  .radial-center .big-pct.ok{color:var(--amber-ink);}
  .radial-center .big-pct.low{color:var(--red-ink);}
  .summary-score .pct-caption{
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:.85rem;color:var(--muted);margin-top:6px;
  }
    display:flex;justify-content:space-between;
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.82rem;color:var(--muted);
    margin-bottom:20px;
  }
  .summary-legend b{color:var(--ink);}
  .summary-section-title{
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:22px 0 10px;
  }
  .breakdown-row{
    display:flex;align-items:center;gap:10px;
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.88rem;
    padding:7px 0;border-bottom:1px solid var(--line);
  }
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-label{flex:1;color:var(--ink);}
  .breakdown-track{
    flex:1.4;height:8px;background:var(--bg2);border-radius:6px;overflow:hidden;
  }
  .breakdown-fill{height:100%;background:var(--red-line);}
  .breakdown-count{
    min-width:26px;text-align:right;font-weight:700;color:var(--red-ink);
  }
  .advice-list{
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.9rem;
    line-height:1.6;padding-left:0;list-style:none;margin:0;
  }
  .advice-list li{
    display:flex;gap:8px;padding:8px 10px;margin-bottom:6px;
    background:var(--amber-bg);border:1px solid var(--amber-line);
    border-radius:10px;color:#5a4212;
  }
  .advice-list li.good{
    background:var(--green-bg);border-color:var(--green-line);color:var(--green-ink);
  }
  .advice-list li .a-ico{flex-shrink:0;}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(38,36,31,.45);
    display:none;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal-backdrop.open{display:flex;}
  .modal-box{
    background:var(--card);
    border-radius:16px;
    padding:20px 22px 18px;
    max-width:380px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    font-family:ui-sans-serif,system-ui,sans-serif;
    position:relative;
  }
  .modal-box h3{
    margin:0 0 4px;
    font-family:'Georgia',serif;
    font-size:1.15rem;
    color:var(--ink);
  }
  .modal-tag{
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:.72rem;
    font-weight:600;
    color:var(--accent2);
    background:var(--green-bg);
    padding:2px 8px;
    border-radius:20px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .modal-box .modal-sub{
    font-size:.78rem;color:var(--muted);margin-bottom:12px;
  }
  .modal-close{
    position:absolute;top:12px;right:14px;
    background:none;border:none;font-size:1.1rem;color:var(--muted);
    cursor:pointer;padding:2px 6px;
  }
  .conj-table{
    width:100%;border-collapse:collapse;font-size:.92rem;
  }
  .conj-table td{
    padding:6px 4px;border-bottom:1px solid var(--line);
  }
  .conj-table td:first-child{
    color:var(--muted);font-size:.82rem;white-space:nowrap;
    font-family:'Georgia',serif;
  }
  .conj-table td.end-col{
    text-align:center;color:var(--accent);font-size:.82rem;white-space:nowrap;
  }
  .conj-table td:last-child{
    text-align:right;font-family:'Georgia',serif;font-weight:600;
  }
  .conj-table tr:last-child td{border-bottom:none;}

  .confirm-text{
    font-size:.92rem;line-height:1.5;margin-bottom:18px;color:var(--ink);
  }
  .confirm-actions{
    display:flex;gap:10px;
  }
  .confirm-actions button{flex:1;}
  .btn-warn{background:var(--accent);color:#fff;}
  .btn-ghost{background:var(--bg2);color:var(--ink);border:1px solid var(--line);}

  /* ---------- главная: выбор темы ---------- */
  .topic-list{display:grid;gap:12px;}
  .topic-card{
    display:flex;align-items:center;gap:15px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04);
    font:inherit;color:var(--ink);transition:border-color .18s, transform .1s;
  }
  .topic-card:hover{border-color:var(--accent2);}
  .topic-card:active{transform:scale(.99);}
  .topic-mark{
    flex:0 0 auto;width:54px;height:54px;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Georgia',serif;font-size:1.6rem;color:#f4f1ea;line-height:1;
  }
  .topic-mark-czasowniki{background:var(--accent2);}
  .topic-mark-liczebniki{background:var(--accent);}
  .topic-body{flex:1;min-width:0;}
  .topic-body h3{margin:0 0 3px;font-size:1.12rem;font-family:'Georgia',serif;}
  .topic-sub{
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.8rem;
    color:var(--muted);line-height:1.4;
  }
  .topic-meta{
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.72rem;
    color:var(--accent2);margin-top:5px;letter-spacing:.03em;font-weight:600;
  }
  .topic-arrow{flex:0 0 auto;color:var(--muted);font-size:1.1rem;}

  /* ---------- экран настройки ---------- */
  .back-link{
    background:none;border:none;padding:4px 0 12px;cursor:pointer;
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.85rem;
    font-weight:600;color:var(--muted);
  }
  .back-link:hover{color:var(--accent2);}
  .setup-section-title{
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.72rem;
    text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:20px 0 10px;font-weight:700;
  }
  .sub-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media (max-width:420px){.sub-chips{grid-template-columns:1fr;}}
  .sub-chip{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:9px 12px;border-radius:12px;cursor:pointer;text-align:left;
    background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    font-family:ui-sans-serif,system-ui,sans-serif;transition:background .15s,border-color .15s;
  }
  .sub-chip-label{font-size:.88rem;font-weight:700;}
  .sub-chip-caption{font-size:.72rem;color:var(--muted);}
  .sub-chip.active{background:var(--accent2);border-color:var(--accent2);color:#fff;}
  .sub-chip.active .sub-chip-caption{color:rgba(255,255,255,.8);}
  .sub-actions{display:flex;gap:8px;justify-content:center;margin-top:10px;}
  .mini-btn{
    background:none;border:none;padding:4px 8px;cursor:pointer;
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.78rem;
    font-weight:600;color:var(--muted);text-decoration:underline dotted;
  }
  .mini-btn:hover{color:var(--accent2);}

  /* ---------- карточка с длинным ответом (числительные) ---------- */
  .card.block .q-sentence{margin-bottom:9px;}
  .card.block input.blank{
    display:block;width:100%;text-align:left;padding:5px 2px;margin-top:2px;
  }
  .blank-gap{
    display:inline-block;min-width:64px;
    border-bottom:2px dotted var(--line);vertical-align:baseline;
  }
  .card.block.correct .blank-gap{border-bottom-color:var(--green-line);}
  .card.block.wrong .blank-gap{border-bottom-color:var(--red-line);}
  .card.block.wrong input.blank{text-decoration:none;}

  /* ---------- заголовки таблицы в модале ---------- */
  .conj-table th{
    text-align:left;padding:5px 8px;
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:.68rem;
    text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    border-bottom:1px solid var(--line);font-weight:700;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge" id="headerBadge">Тренажёр</span>
    <h1 id="headerTitle">Польский язык</h1>
    <p id="headerSub">Выбери тему, которую хочешь потренировать.</p>
  </header>

  <div id="app"></div>

  <footer id="footerNote"></footer>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
/* ============ ОБЩЕЕ ============ */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function normalize(s){
  return (s || '').trim().toLowerCase().replace(/\s+/g,' ');
}

/* ============ ТЕМА: ГЛАГОЛЫ (данные) ============ */
const PERSON_LABEL = {
  "ja":"1 лицо ед.ч. (ja)",
  "ty":"2 лицо ед.ч. (ty)",
  "on/ona/ono":"3 лицо ед.ч. (on/ona/ono)",
  "my":"1 лицо мн.ч. (my)",
  "wy":"2 лицо мн.ч. (wy)",
  "oni/one":"3 лицо мн.ч. (oni/one)"
};
const PERSON_ORDER = ["ja","ty","on/ona/ono","my","wy","oni/one"];

const PARADIGMS = {
  "być":       ["jestem","jesteś","jest","jesteśmy","jesteście","są"],
  "mieć":      ["mam","masz","ma","mamy","macie","mają"],
  "mówić":     ["mówię","mówisz","mówi","mówimy","mówicie","mówią"],
  "czytać":    ["czytam","czytasz","czyta","czytamy","czytacie","czytają"],
  "pisać":     ["piszę","piszesz","pisze","piszemy","piszecie","piszą"],
  "robić":     ["robię","robisz","robi","robimy","robicie","robią"],
  "iść":       ["idę","idziesz","idzie","idziemy","idziecie","idą"],
  "jechać":    ["jadę","jedziesz","jedzie","jedziemy","jedziecie","jadą"],
  "jeść":      ["jem","jesz","je","jemy","jecie","jedzą"],
  "pić":       ["piję","pijesz","pije","pijemy","pijecie","piją"],
  "chcieć":    ["chcę","chcesz","chce","chcemy","chcecie","chcą"],
  "móc":       ["mogę","możesz","może","możemy","możecie","mogą"],
  "wiedzieć":  ["wiem","wiesz","wie","wiemy","wiecie","wiedzą"],
  "znać":      ["znam","znasz","zna","znamy","znacie","znają"],
  "mieszkać":  ["mieszkam","mieszkasz","mieszka","mieszkamy","mieszkacie","mieszkają"],
  "pracować":  ["pracuję","pracujesz","pracuje","pracujemy","pracujecie","pracują"],
  "uczyć się": ["uczę się","uczysz się","uczy się","uczymy się","uczycie się","uczą się"],
  "lubić":     ["lubię","lubisz","lubi","lubimy","lubicie","lubią"],

const TOPICS = {
  czasowniki: {
    id:'czasowniki',
    title:'Глаголы',
    subtitle:'Спряжение в настоящем времени',
    quizTitle:'Спряжение глаголов — настоящее время',
    mark:'cz',
    level:'A1',
    subtopics:null,
    footer:'Глаголы: być, mieć, mówić, czytać, pisać, robić, iść, jechać, jeść, pić, chcieć, móc, wiedzieć, znać, mieszkać, pracować, uczyć się, lubić, grać, słuchać, kupować, rozumieć, spać, widzieć, pomagać, jeździć, tańczyć, gotować, pływać.',
    hintNote:'У ошибок слово «спряжение»/«Исключение» кликабельно — открывает таблицу всех форм.',
    blockInput:false,

    questions(){
      return VERB_DATA.map(q => {
        const isExc = EXCEPTIONS.has(q.v);
        const group = isExc ? null : getConjGroup(q.v);
        return {
          g: isExc ? 'EXC' : (group ? group.key : 'OTHER'),
          hint: q.v,
          sentence: q.sentence,
          answer: q.answer,
          ref: q.v,
          person: q.person,
          v: q.v
        };
      });
    },

    groupLabel(key){
      if(key === 'EXC') return 'Исключения';
      return CONJ_GROUPS[key] ? CONJ_GROUPS[key].shortLabel : key;
    },

    wrongHtml(q){
      if(q.g === 'EXC'){
        return `<span class="icon">✕</span><button type="button" class="ref-link" data-ref="${q.ref}">Исключение</button>. Правильно: <b>${q.answer}</b>.`;
      }
      const group = CONJ_GROUPS[q.g];
      if(!group) return `<span class="icon">✕</span>Правильно: <b>${q.answer}</b>.`;
      const ending = group.endings[q.person];
      return `<span class="icon">✕</span>По <button type="button" class="ref-link" data-ref="${q.ref}">спряжению</button> — ${group.label}, ${PERSON_LABEL[q.person]}, окончание <b>${ending}</b> → нужно <b>${q.answer}</b>.`;
    },

    adviceHtml(key){
      if(key === 'EXC'){
        return `<li><span class="a-ico">📌</span><span>Учи наизусть <button type="button" class="ref-link" data-ref="${EXC_BASE_VERB}">глаголы-исключения</button>: być, mieć, iść, jechać, jeść, chcieć, móc, wiedzieć — их формы не подчиняются общим правилам.</span></li>`;
      }
      const g = CONJ_GROUPS[key];
      if(!g) return '';
      const endsStr = PERSON_ORDER.map(p => `${p} ${g.endings[p]}`).join(', ');
      return `<li><span class="a-ico">📌</span><span>Подтяни <button type="button" class="ref-link" data-ref="${g.baseVerb}">${g.shortLabel}</button> — глаголы с окончанием инфинитива «<b>${g.infEnding}</b>» (например <i>${g.baseVerb}</i>). Личные окончания: ${endsStr}.</span></li>`;
    },

    reference(refKey){
      const forms = PARADIGMS[refKey];
      if(!forms) return null;
      const isExc = EXCEPTIONS.has(refKey);
      const group = isExc ? null : getConjGroup(refKey);
      return {
        title: refKey,
        tag: isExc ? 'Искл.' : (group ? group.shortLabel : ''),
        sub: 'Все формы, настоящее время',
        cols: ['Лицо','Окончание','Форма'],
        rows: PERSON_ORDER.map((p, i) => [p, (!isExc && group) ? group.endings[p] : '—', forms[i]])
      };
    }
  },

  liczebniki: {
    id:'liczebniki',

    subtitle:'Цифры, даты и время словами',

    groupLabel(key){
      const s = NUM_SUBTOPICS.find(s => s.id === key);

    wrongHtml(q){
      return `<span class="icon">✕</span><button type="button" class="ref-link" data-ref="${q.ref}">${this.groupLabel(q.g)}</button> — правильно: <b>${q.answer}</b>.`;
    },

    adviceHtml(key){
      const s = NUM_SUBTOPICS.find(s => s.id === key);
      const ref = NUM_REF[key];
      if(!s || !ref) return '';
      return `<li><span class="a-ico">📌</span><span>Подтяни <button type="button" class="ref-link" data-ref="${key}">${s.label.toLowerCase()}</button> (${s.caption}). ${ref.sub}</span></li>`;
    },

    reference(refKey){
      const r = NUM_REF[refKey];
      if(!r) return null;
      return {title:r.title, tag:'Подсказка', sub:r.sub, cols:r.cols, rows:r.rows};
    }
  }
};

const TOPIC_ORDER = ['czasowniki','liczebniki'];

/* ============ СОСТОЯНИЕ ============ */
const BATCH_SIZE = 10;

let state = 'home';            // 'home' | 'setup' | 'quiz' | 'summary'
let topic = null;              // текущая тема из TOPICS
let selectedSubs = null;       // Set выбранных подтем (null, если у темы их нет)
let selectedCount = 3;
let sessionBatches = [];
let currentIndex = 0;
let checked = false;
let stats = null;

const app = document.getElementById('app');
const headerTitle = document.getElementById('headerTitle');
const headerSub = document.getElementById('headerSub');
const headerBadge = document.getElementById('headerBadge');
const footerNote = document.getElementById('footerNote');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalBox = document.getElementById('modalBox');

function currentPool(){
  return topic.questions(selectedSubs);
}
function maxTests(){
  return Math.max(1, Math.floor(currentPool().length / BATCH_SIZE));
}
function buildBatches(){
  const all = shuffle(currentPool());
  const batches = [];
  for(let i = 0; i < all.length; i += BATCH_SIZE){
    batches.push(all.slice(i, i + BATCH_SIZE));
  }
  return batches.filter(b => b.length > 0);
}

function resetStats(){
  stats = {correct:0, wrong:0, total:0, byGroup:{}};
}
function bumpStat(key, ok){
  if(!stats.byGroup[key]) stats.byGroup[key] = {wrong:0, total:0};
  stats.byGroup[key].total++;
  if(!ok) stats.byGroup[key].wrong++;
}

function setHeader(badge, title, sub){
  headerBadge.textContent = badge;
  headerTitle.textContent = title;
  headerSub.textContent = sub;
}

/* ============ ГЛАВНАЯ: ВЫБОР ТЕМЫ ============ */
function renderHome(){
  setHeader('Тренажёр', 'Польский язык', 'Выбери тему, которую хочешь потренировать.');
  footerNote.style.display = 'none';

  const cards = TOPIC_ORDER.map(id => {
    const t = TOPICS[id];
    const total = t.questions(null).length;
    const subs = t.subtopics ? t.subtopics.map(s => s.label).join(' · ') : t.subtitle;
    return `
      <button type="button" class="topic-card" data-topic="${id}">
        <div class="topic-mark topic-mark-${id}">${t.mark}</div>
        <div class="topic-body">
          <h3>${t.title}</h3>
          <div class="topic-sub">${subs}</div>
          <div class="topic-meta">${t.level} · ${total} ${plural(total,'вопрос','вопроса','вопросов')}</div>
        </div>
        <div class="topic-arrow">→</div>
      </button>`;
  }).join('');

  app.innerHTML = `<div class="topic-list">${cards}</div>`;

  app.querySelectorAll('.topic-card').forEach(c => {
    c.addEventListener('click', () => {
      topic = TOPICS[c.dataset.topic];
      selectedSubs = topic.subtopics ? new Set(topic.subtopics.map(s => s.id)) : null;
      selectedCount = Math.min(3, maxTests());
      state = 'setup';
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

function plural(n, one, few, many){
  const n10 = n % 10, n100 = n % 100;
  if(n10 === 1 && n100 !== 11) return one;
  if(n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
}

    </div>
    <div class="sub-actions">
      <button type="button" class="mini-btn" id="subAll">Все</button>
      <button type="button" class="mini-btn" id="subNone">Снять все</button>
    </div>` : '';

  app.innerHTML = `
    <button type="button" class="back-link" id="backHome">← Другая тема</button>
    <div class="start-card">
      <h2>${topic.title}</h2>
      <div class="sub">${topic.subtitle}</div>
      ${subsHtml}
      <div class="setup-section-title">Сколько тестов</div>
      <div class="stepper">
        <button type="button" id="stepDown">−</button>
        <div class="stepper-value" id="stepValue">${selectedCount}</div>
        <button type="button" id="stepUp">+</button>
      </div>
      <div class="stepper-caption" id="stepCaption"></div>
      <div class="quick-chips" id="quickChips"></div>
      <button type="button" class="btn-start" id="startBtn">Начать</button>
    </div>
  `;

  function syncAll(){
    const pool = currentPool().length;
    const max = maxTests();
    if(selectedCount > max) selectedCount = max;
    if(selectedCount < 1) selectedCount = 1;

    document.getElementById('stepValue').textContent = selectedCount;
    document.getElementById('stepCaption').textContent =
      pool === 0
        ? 'Выбери хотя бы одну подтему'
        : `тестов подряд (максимум ${max} из ${pool} ${plural(pool,'вопроса','вопросов','вопросов')})`;

    const chips = [...new Set([1, 3, 5, max])].filter(n => n >= 1 && n <= max).sort((a,b) => a-b);
    document.getElementById('quickChips').innerHTML = chips.map(n =>
      `<button type="button" class="chip${n === selectedCount ? ' active' : ''}" data-n="${n}">${n === max && max > 1 ? 'Все ('+max+')' : n}</button>`
    ).join('');
    document.querySelectorAll('#quickChips .chip').forEach(c => {
      c.addEventListener('click', () => { selectedCount = Number(c.dataset.n); syncAll(); });
    });

    if(topic.subtopics){
      document.querySelectorAll('#subChips .sub-chip').forEach(c => {
        c.classList.toggle('active', selectedSubs.has(c.dataset.sub));
      });
    }
    document.getElementById('startBtn').disabled = pool === 0;
  }

  document.getElementById('backHome').addEventListener('click', () => {
    state = 'home'; render(); window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('stepDown').addEventListener('click', () => { selectedCount--; syncAll(); });
  document.getElementById('stepUp').addEventListener('click', () => { selectedCount++; syncAll(); });

  if(topic.subtopics){
    document.querySelectorAll('#subChips .sub-chip').forEach(c => {
      c.addEventListener('click', () => {
        const id = c.dataset.sub;
        if(selectedSubs.has(id)) selectedSubs.delete(id); else selectedSubs.add(id);
        syncAll();
      });
    });
    document.getElementById('subAll').addEventListener('click', () => {
      topic.subtopics.forEach(s => selectedSubs.add(s.id)); syncAll();
    });
    document.getElementById('subNone').addEventListener('click', () => {
      selectedSubs.clear(); syncAll();
    });
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    if(currentPool().length === 0) return;
    sessionBatches = buildBatches().slice(0, selectedCount);
    currentIndex = 0;
    resetStats();
    state = 'quiz';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  syncAll();
}

/* ============ ЭКРАН ТЕСТА ============ */
function renderQuiz(){
  setHeader(topic.level, topic.quizTitle, topic.hintNote);
  footerNote.textContent = topic.footer;
  footerNote.style.display = 'block';
  checked = false;

  const batch = sessionBatches[currentIndex];

  app.innerHTML = `
    <div class="toolbar">
      <div class="test-label">Тест ${currentIndex+1} / ${sessionBatches.length}</div>
      <div class="score" id="scoreLabel">0 / ${batch.length}</div>
    </div>
    <div class="grid" id="quiz"></div>
    <div class="result-banner" id="resultBanner"></div>
    <div class="actions">
      <button class="btn-primary" id="checkBtn">Проверить ответы</button>
      <button class="btn-next" id="nextBtn">Следующий тест →</button>
      <button class="btn-secondary" id="resetBtn">В начало</button>
    </div>
    <div class="dots" id="dots"></div>
  `;

  const quizEl = document.getElementById('quiz');
  batch.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (topic.blockInput ? ' block' : '');
    card.dataset.index = i;

    const parts = q.sentence.split('___');
    const meta = document.createElement('div');
    meta.className = 'q-meta';
    meta.innerHTML = `<span>Предложение ${i+1}</span><span class="verb-hint">${q.hint}</span>`;

    const sentence = document.createElement('div');
    sentence.className = 'q-sentence';
    const field = `<input type="text" class="blank" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-i="${i}">`;
    sentence.innerHTML = topic.blockInput
      ? `${parts[0]}<span class="blank-gap"></span>${parts[1] || ''}${field}`
      : `${parts[0]}${field}${parts[1] || ''}`;

    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.id = `fb-${i}`;

    card.appendChild(meta);
    card.appendChild(sentence);
    card.appendChild(feedback);
    quizEl.appendChild(card);
  });

  quizEl.querySelectorAll('input.blank').forEach((inp, idx, arr) => {
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        e.preventDefault();
        if(idx+1 < arr.length){ arr[idx+1].focus(); }
        else { requestCheck(); }
      }
    });
  });
  quizEl.addEventListener('input', updateCount);
  updateCount();
  renderDots();

  document.getElementById('checkBtn').addEventListener('click', requestCheck);
  document.getElementById('resetBtn').addEventListener('click', () => {
    state = 'setup'; render(); window.scrollTo({top:0, behavior:'smooth'});
  });
}

function updateCount(){
  if(checked) return;
  const inputs = document.querySelectorAll('#quiz input.blank');
  const scoreLabel = document.getElementById('scoreLabel');
  let filled = 0;
  inputs.forEach(inp => { if(inp.value.trim() !== '') filled++; });
  if(scoreLabel) scoreLabel.textContent = `${filled} / ${inputs.length}`;
}

function renderDots(){
  const dotsEl = document.getElementById('dots');
  if(!dotsEl) return;
  dotsEl.innerHTML = '';
  sessionBatches.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentIndex ? ' active' : '') + (i < currentIndex ? ' done' : '');
    dotsEl.appendChild(d);
  });
}

function requestCheck(){
  const inputs = document.querySelectorAll('#quiz input.blank');
  let empty = 0;
  inputs.forEach(inp => { if(inp.value.trim() === '') empty++; });
  if(empty > 0) showConfirmModal(empty, inputs.length);
  else checkAnswers();
}

function showConfirmModal(empty, total){
  modalBox.innerHTML = `
    <button type="button" class="modal-close" id="modalCloseBtn">✕</button>
    <h3>Не все поля заполнены</h3>
    <div class="confirm-text">Пусто: <b>${empty}</b> из <b>${total}</b> предложений. Точно проверить сейчас? Пустые поля засчитаются как неправильные.</div>
    <div class="confirm-actions">
      <button type="button" class="btn-ghost" id="confirmBack">Вернуться</button>
      <button type="button" class="btn-warn" id="confirmGo">Всё равно проверить</button>
    </div>
  `;
  modalBackdrop.classList.add('open');
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('confirmBack').addEventListener('click', closeModal);
  document.getElementById('confirmGo').addEventListener('click', () => { closeModal(); checkAnswers(); });
}

function isCorrect(q, value){
  const user = normalize(value);
  if(user === normalize(q.answer)) return true;
  return (q.alt || []).some(a => normalize(a) === user);
}

function checkAnswers(){
  const batch = sessionBatches[currentIndex];
  let correctCount = 0;

  batch.forEach((q, i) => {
    const card = document.querySelector(`#quiz .card[data-index="${i}"]`);
    const input = card.querySelector('input.blank');
    const fb = document.getElementById(`fb-${i}`);
    card.classList.remove('correct','wrong');
    input.disabled = true;
    fb.innerHTML = '';

    const ok = isCorrect(q, input.value);
    stats.total++;
    bumpStat(q.g, ok);

    if(ok){
      card.classList.add('correct');
      correctCount++;
      stats.correct++;
    } else {
      card.classList.add('wrong');
      stats.wrong++;
      fb.innerHTML = topic.wrongHtml(q);
    }
  });

  checked = true;
  document.getElementById('scoreLabel').textContent = `${correctCount} / ${batch.length}`;

  const pct = Math.round(correctCount/batch.length*100);
  const resultBanner = document.getElementById('resultBanner');
  resultBanner.style.display = 'block';
  resultBanner.style.background = pct >= 80 ? 'var(--green-bg)' : pct >= 50 ? 'var(--amber-bg)' : 'var(--red-bg)';
  resultBanner.style.color = pct >= 80 ? 'var(--green-ink)' : pct >= 50 ? 'var(--amber-ink)' : 'var(--red-ink)';
  resultBanner.style.border = '1px solid ' + (pct >= 80 ? 'var(--green-line)' : pct >= 50 ? 'var(--amber-line)' : 'var(--red-line)');
  resultBanner.innerHTML = `Результат теста ${currentIndex+1}: <b>${correctCount} / ${batch.length}</b> (${pct}%)`;

  document.getElementById('checkBtn').style.display = 'none';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  const isLast = currentIndex >= sessionBatches.length - 1;
  nextBtn.textContent = isLast ? 'Посмотреть итоги →' : 'Следующий тест →';
  nextBtn.addEventListener('click', () => {
    if(isLast){ state = 'summary'; } else { currentIndex++; }
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }, {once:true});

  renderDots();
  document.querySelector('.toolbar').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ============ ИТОГИ ============ */
const RADIAL_R = 66;
const RADIAL_C = 2 * Math.PI * RADIAL_R;

function renderSummary(){
  setHeader(topic.level, topic.quizTitle, 'Итоги сессии.');
  footerNote.style.display = 'none';

  const pct = stats.total ? Math.round(stats.correct/stats.total*100) : 0;
  const pctClass = pct >= 80 ? 'great' : pct >= 50 ? 'ok' : 'low';

  const rows = Object.keys(stats.byGroup)
    .filter(k => stats.byGroup[k].wrong > 0)
    .map(k => ({key:k, label:topic.groupLabel(k), wrong:stats.byGroup[k].wrong, total:stats.byGroup[k].total}))
    .sort((a,b) => b.wrong - a.wrong);
  const maxWrong = rows.length ? rows[0].wrong : 1;

  const breakdownHtml = rows.length ? rows.map(r => `
    <div class="breakdown-row">
      <div class="breakdown-label">${r.label}</div>
      <div class="breakdown-track"><div class="breakdown-fill" style="width:${Math.round(r.wrong/maxWrong*100)}%"></div></div>
      <div class="breakdown-count">${r.wrong}</div>
    </div>
  `).join('') : `<div class="breakdown-row"><div class="breakdown-label">Ошибок не было 🎉</div></div>`;

  const adviceHtml = stats.wrong === 0
    ? `<li class="good"><span class="a-ico">🎉</span><span>Отлично! Все ответы верные — можно увеличить число тестов за сессию или взять другую тему.</span></li>`
    : rows.slice(0, 2).map(r => topic.adviceHtml(r.key)).join('');

  app.innerHTML = `
    <div class="summary-card">
      <div class="summary-score">
        <div class="radial-wrap">
          <svg width="168" height="168" viewBox="0 0 168 168">
            <circle class="radial-track" cx="84" cy="84" r="${RADIAL_R}"></circle>
            <circle class="radial-fill ${pctClass}" id="radialFill" cx="84" cy="84" r="${RADIAL_R}"
              stroke-dasharray="${RADIAL_C}" stroke-dashoffset="${RADIAL_C}"></circle>
          </svg>
          <div class="radial-center"><div class="big-pct ${pctClass}">${pct}%</div></div>
        </div>
        <div class="pct-caption">верно: <b>${stats.correct}</b> из <b>${stats.total}</b> (${sessionBatches.length} ${plural(sessionBatches.length,'тест','теста','тестов')})</div>
      </div>
      <div class="summary-legend">
        <span>✓ Правильно: <b>${stats.correct}</b></span>
        <span>✕ Ошибок: <b>${stats.wrong}</b></span>
      </div>

      <div class="summary-section-title">Ошибки по типам</div>
      ${breakdownHtml}

      <div class="summary-section-title">Что подтянуть</div>
      <ul class="advice-list">${adviceHtml}</ul>
    </div>
    <div class="actions">
      <button class="btn-primary" id="restartBtn">Пройти ещё раз</button>
      <button class="btn-secondary" id="homeBtn">Другая тема</button>
    </div>
  `;

  document.getElementById('restartBtn').addEventListener('click', () => {
    state = 'setup'; render(); window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('homeBtn').addEventListener('click', () => {
    state = 'home'; render(); window.scrollTo({top:0, behavior:'smooth'});
  });

  const fillEl = document.getElementById('radialFill');
  const targetOffset = RADIAL_C * (1 - pct/100);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { fillEl.style.strokeDashoffset = String(targetOffset); });
  });
}

/* ============ МОДАЛ-ПОДСКАЗКА ============ */
document.addEventListener('click', (e) => {
  const link = e.target.closest('.ref-link');
  if(link){ openRefModal(link.dataset.ref); return; }
  if(e.target === modalBackdrop) closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});

function openRefModal(refKey){
  if(!topic) return;
  const r = topic.reference(refKey);
  if(!r) return;

  const head = `<tr>${r.cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
  const body = r.rows.map(row =>
    `<tr>${row.map((cell, i) => `<td${i === 1 && r.cols.length === 3 ? ' class="end-col"' : ''}>${cell}</td>`).join('')}</tr>`
  ).join('');

  modalBox.innerHTML = `
    <button type="button" class="modal-close" id="modalCloseBtn">✕</button>
    <h3>${r.title} ${r.tag ? `<span class="modal-tag">(${r.tag})</span>` : ''}</h3>
    <div class="modal-sub">${r.sub}</div>
    <table class="conj-table">${head}${body}</table>
  `;
  modalBackdrop.classList.add('open');
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  modalBox.scrollTop = 0;
}

function closeModal(){
  modalBackdrop.classList.remove('open');
}

/* ============ РОУТЕР ============ */
function render(){
  if(state === 'home') renderHome();
  else if(state === 'setup') renderSetup();
  else if(state === 'quiz') renderQuiz();
  else if(state === 'summary') renderSummary();
}

render();

/* ============ ЗАПРЕТ ЗУМА ============
   touch-action:manipulation в CSS убирает зум по двойному тапу,
   а это — щипок двумя пальцами в Safari. */
['gesturestart','gesturechange','gestureend'].forEach(ev => {
  document.addEventListener(ev, e => e.preventDefault(), {passive:false});
});

/* ============ PWA: офлайн-режим ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
