<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Польский — тренажёр</title>

<!-- PWA: установка на домашний экран -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#33459b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polski">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg-top:#33459b;
    --bg-bot:#161e4d;
    --panel:#3a52ad;
    --panel-2:#2b3d8d;
    --panel-line:#6d8dee;
    --deep:#1b2559;
    --ink:#ffffff;
    --muted:#a9bcf2;
    --card:#ffffff;
    --card-ink:#1c2547;
    --card-line:#d8e1ff;
    --green:#5fd46f;      --green-2:#3fae4d;  --green-dark:#2a7a34;
    --blue:#5ba3ff;       --blue-2:#2f7ae0;   --blue-dark:#1f56a8;
    --amber:#ffc44d;      --amber-2:#f0a018;  --amber-dark:#b9760a;
    --red:#ff7361;        --red-2:#e8442c;    --red-dark:#a82c1a;
    --gold:#ffd23f;
    --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font);
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 70%) fixed;
    background-color:var(--bg-bot);
    color:var(--ink);
    min-height:100vh;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
            calc(24px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
    touch-action:manipulation;
  }
  html{touch-action:manipulation;}
  .wrap{max-width:560px;margin:0 auto;}

  /* ---------- HUD ---------- */
  .hud{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .hud-pill{
    display:flex;align-items:center;gap:7px;
    background:var(--deep);border:2px solid #4d69c9;border-radius:999px;
    padding:4px 13px 4px 4px;box-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  .hud-ico{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:.85rem;
    background:linear-gradient(180deg,#ffd964,#f0a51a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
  }
  .hud-ico.cup{background:linear-gradient(180deg,#8fd0ff,#3d8ede);}
  .hud-val{font-weight:800;font-size:.95rem;letter-spacing:.01em;}
  .hud-spacer{flex:1;}

  /* ---------- панели ---------- */
  .panel{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:2px solid var(--panel-line);border-radius:22px;
    padding:16px;margin-bottom:12px;
    box-shadow:0 6px 0 rgba(0,0,0,.26), inset 0 2px 0 rgba(255,255,255,.16);
  }
  .panel-title{
    font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin-bottom:10px;text-align:center;
  }

  /* ---------- кнопки ---------- */
  .gbtn{
    border:none;border-radius:18px;cursor:pointer;font-family:var(--font);
    font-weight:800;font-size:1.02rem;color:#fff;padding:15px 20px;width:100%;
    text-shadow:0 2px 0 rgba(0,0,0,.22);
    box-shadow:0 5px 0 var(--bd), 0 9px 14px rgba(0,0,0,.26), inset 0 2px 0 rgba(255,255,255,.3);
    transition:transform .06s, box-shadow .06s, filter .15s;
  }
  .gbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd), inset 0 2px 0 rgba(255,255,255,.28);}
  .gbtn:disabled{filter:grayscale(.7) brightness(.75);cursor:not-allowed;}
  .gbtn:disabled:active{transform:none;box-shadow:0 5px 0 var(--bd), inset 0 2px 0 rgba(255,255,255,.3);}
  .g-green{background:linear-gradient(180deg,var(--green),var(--green-2));--bd:var(--green-dark);}
  .g-blue{background:linear-gradient(180deg,var(--blue),var(--blue-2));--bd:var(--blue-dark);}
  .g-amber{background:linear-gradient(180deg,var(--amber),var(--amber-2));--bd:var(--amber-dark);}
  .g-ghost{background:linear-gradient(180deg,#516cc8,#3a4da3);--bd:#26336e;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .gbtn{flex:1;}
  .btn-xl{font-size:1.18rem;padding:18px 20px;letter-spacing:.03em;}

  /* ---------- свайпер ---------- */
  .swiper{position:relative;}
  .swiper-track{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    scrollbar-width:none;-ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;
  }
  .swiper-track::-webkit-scrollbar{display:none;}
  .slide{flex:0 0 100%;scroll-snap-align:center;padding:0 2px;}
  .sw-arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.45);
    background:rgba(15,22,60,.55);color:#fff;font-size:1.1rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font);
    padding:0;line-height:1;
  }
  .sw-arrow:active{background:rgba(15,22,60,.8);}
  .sw-prev{left:-4px;} .sw-next{right:-4px;}
  .sw-dots{display:flex;justify-content:center;gap:6px;margin-top:10px;}
  .sw-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .2s;}
  .sw-dot.active{background:var(--gold);width:22px;border-radius:999px;}

  /* ---------- карточка темы / подтемы ---------- */
  .pick{
    border-radius:20px;padding:20px 16px;text-align:center;
    box-shadow:0 5px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.25);
    border:2px solid rgba(255,255,255,.28);
  }
  .pick-topic{min-height:186px;display:flex;flex-direction:column;justify-content:center;}
  .pick-sub{min-height:132px;display:flex;flex-direction:column;justify-content:center;}
  .pick-c-green{background:linear-gradient(180deg,#57cc6a,#2f9440);}
  .pick-c-amber{background:linear-gradient(180deg,#ffb445,#e8791f);}
  .pick-c-blue{background:linear-gradient(180deg,#5ba3ff,#2f6fd0);}
  .pick-emoji{
    width:66px;height:66px;margin:0 auto 10px;border-radius:50%;
    background:rgba(255,255,255,.24);border:2px solid rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;font-size:2rem;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);
  }
  .pick-sub .pick-emoji{width:52px;height:52px;font-size:1.55rem;margin-bottom:8px;}
  .pick h2{margin:0 0 5px;font-size:1.35rem;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.2);}
  .pick-sub h2{font-size:1.15rem;}
  .pick p{margin:0;font-size:.85rem;font-weight:600;color:rgba(255,255,255,.9);line-height:1.35;}
  .pick-count{
    display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;
    background:rgba(0,0,0,.22);font-size:.76rem;font-weight:800;letter-spacing:.02em;
  }

  /* ---------- степпер ---------- */
  .stepper{display:flex;align-items:center;justify-content:center;gap:16px;}
  .step-btn{
    width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(180deg,#5ba3ff,#2f7ae0);color:#fff;
    font-size:1.7rem;font-weight:800;font-family:var(--font);line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0;
    box-shadow:0 4px 0 var(--blue-dark), inset 0 2px 0 rgba(255,255,255,.3);
  }
  .step-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark);}
  .step-btn:disabled{filter:grayscale(.7) brightness(.7);}
  .step-val{
    min-width:86px;text-align:center;font-size:2.4rem;font-weight:900;
    text-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  .step-caption{text-align:center;font-size:.8rem;font-weight:600;color:var(--muted);margin-top:8px;}

  /* ---------- прогресс ---------- */
  .pbar{
    height:15px;background:var(--deep);border:2px solid #4d69c9;
    border-radius:999px;overflow:hidden;flex:1;
  }
  .pbar-fill{
    height:100%;border-radius:999px;transition:width .35s ease;
    background:linear-gradient(180deg,#8ce6ff,#33b3ef);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);
  }
  .quizbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .quizbar-label{font-size:.82rem;font-weight:800;white-space:nowrap;}

  /* ---------- карточки вопросов ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  @media (max-width:620px){.grid{grid-template-columns:1fr;}}
  .card{
    position:relative;background:var(--card);color:var(--card-ink);
    border:2px solid var(--card-line);border-radius:18px;padding:13px 15px 15px;
    box-shadow:0 4px 0 rgba(0,0,0,.2);
  }
  .card.correct{background:#eefbf0;border-color:var(--green-2);box-shadow:0 4px 0 var(--green-dark);}
  .card.close{background:#fff7e4;border-color:var(--amber-2);box-shadow:0 4px 0 var(--amber-dark);}
  .card.wrong{background:#fff0ed;border-color:var(--red-2);box-shadow:0 4px 0 var(--red-dark);}
  .q-meta{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    color:#7d89b8;margin-bottom:7px;
  }
  .q-hint{
    color:#fff;background:linear-gradient(180deg,#7d8ec9,#5b6cae);
    padding:3px 9px;border-radius:999px;font-size:.68rem;letter-spacing:.03em;
    text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%;
  }
  .card.correct .q-hint{background:linear-gradient(180deg,var(--green),var(--green-2));}
  .card.close .q-hint{background:linear-gradient(180deg,var(--amber),var(--amber-2));}
  .card.wrong .q-hint{background:linear-gradient(180deg,var(--red),var(--red-2));}
  .q-sentence{font-size:1rem;line-height:1.55;font-weight:600;}
  input.blank{
    font-family:var(--font);font-size:16px;font-weight:800;
    border:2px solid #ccd8ff;border-radius:11px;background:#f3f7ff;
    padding:7px 10px;width:130px;text-align:center;color:var(--card-ink);
    outline:none;transition:border-color .15s, background .15s;
  }
  input.blank:focus{border-color:var(--blue-2);background:#fff;}
  input.blank:disabled{opacity:1;}
  .card.correct input.blank{border-color:var(--green-2);background:#dff6e3;color:#1d6b2c;}
  .card.close input.blank{border-color:var(--amber-2);background:#fff0d0;color:#8a5c05;}
  .card.wrong input.blank{border-color:var(--red-2);background:#ffe2dd;color:#a3301b;}
  .given{
    font-family:var(--font);font-size:16px;font-weight:800;
    border:2px solid #ccd8ff;border-radius:11px;background:#f3f7ff;
    padding:7px 10px;color:var(--card-ink);
    word-break:break-word;line-height:1.4;min-height:38px;
  }
  .card:not(.block) .given{display:inline-block;min-width:130px;text-align:center;vertical-align:middle;}
  .card.correct .given{border-color:var(--green-2);background:#dff6e3;color:#1d6b2c;}
  .card.close .given{border-color:var(--amber-2);background:#fff0d0;color:#8a5c05;}
  .card.wrong .given{border-color:var(--red-2);background:#ffe2dd;color:#a3301b;}
  .card.block .q-sentence{margin-bottom:8px;}
  .card.block input.blank{display:block;width:100%;text-align:left;}
  .blank-gap{
    display:inline-block;min-width:62px;border-bottom:3px dotted #b9c6f2;vertical-align:baseline;
  }
  .card.correct .blank-gap{border-bottom-color:var(--green-2);}
  .card.close .blank-gap{border-bottom-color:var(--amber-2);}
  .card.wrong .blank-gap{border-bottom-color:var(--red-2);}
  .pts{
    position:absolute;top:-10px;left:12px;padding:3px 10px;border-radius:999px;
    font-size:.76rem;font-weight:900;color:#fff;border:2px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,.28);
  }
  .pts.full{background:linear-gradient(180deg,var(--green),var(--green-2));}
  .pts.part{background:linear-gradient(180deg,var(--amber),var(--amber-2));}
  .pts.zero{background:linear-gradient(180deg,var(--red),var(--red-2));}
  .feedback{
    margin-top:8px;font-size:.8rem;font-weight:600;line-height:1.5;display:none;
    color:#5c3226;background:rgba(0,0,0,.045);padding:7px 9px;border-radius:10px;
  }
  .card.close .feedback,.card.wrong .feedback{display:block;}
  .icon{margin-right:4px;}
  .ref-link{
    color:var(--blue-dark);font-weight:900;text-decoration:underline;
    cursor:pointer;border:none;background:none;padding:0;font:inherit;
  }

  /* ---------- баннер результата ---------- */
  .result-banner{
    display:none;text-align:center;font-weight:800;font-size:.95rem;
    padding:13px;border-radius:16px;margin-top:12px;border:2px solid;
  }
  .rb-great{background:#e6faea;color:#1d6b2c;border-color:var(--green-2);}
  .rb-ok{background:#fff5e0;color:#8a5c05;border-color:var(--amber-2);}
  .rb-low{background:#ffeeeb;color:#a3301b;border-color:var(--red-2);}
  .actions{display:flex;gap:10px;margin-top:14px;}
  .actions .gbtn{flex:1;}

  /* ---------- итоги ---------- */
  .score-hero{text-align:center;padding:6px 0 2px;}
  .stars{font-size:2rem;letter-spacing:6px;margin-bottom:6px;}
  .star{color:rgba(255,255,255,.22);}
  .star.on{color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.65);}
  .big-points{font-size:3.2rem;font-weight:900;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.28);}
  .big-points-cap{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:4px;}
  .score-line{
    display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap;
  }
  .score-chip{
    background:var(--deep);border:2px solid #4d69c9;border-radius:999px;
    padding:6px 14px;font-size:.82rem;font-weight:800;
  }
  .best-flag{
    display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;
    background:linear-gradient(180deg,var(--gold),#f0a51a);color:#4a3000;
    font-weight:900;font-size:.8rem;box-shadow:0 3px 0 #b9760a;
  }
  .breakdown-row{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:.83rem;font-weight:700;}
  .breakdown-label{flex:0 0 40%;}
  .breakdown-track{flex:1;height:11px;background:var(--deep);border-radius:999px;overflow:hidden;border:1px solid #4d69c9;}
  .breakdown-fill{height:100%;background:linear-gradient(180deg,var(--red),var(--red-2));border-radius:999px;}
  .breakdown-count{flex:0 0 24px;text-align:right;font-weight:900;color:var(--red);}
  .advice-list{list-style:none;padding:0;margin:0;}
  .advice-list li{
    display:flex;gap:9px;background:rgba(0,0,0,.16);border-radius:14px;
    padding:11px 13px;margin-bottom:8px;font-size:.83rem;font-weight:600;line-height:1.5;
  }
  .advice-list .ref-link{color:var(--gold);}
  .a-ico{flex:0 0 auto;}

  /* ---------- модал ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(8,12,35,.72);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:50;
  }
  .modal-backdrop.open{display:flex;}
  .modal-box{
    position:relative;width:100%;max-width:420px;max-height:82vh;overflow-y:auto;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:2px solid var(--panel-line);border-radius:22px;padding:20px;
    box-shadow:0 10px 0 rgba(0,0,0,.3), 0 20px 40px rgba(0,0,0,.5);
  }
  .modal-box h3{margin:0 0 4px;font-size:1.2rem;font-weight:900;padding-right:34px;}
  .modal-tag{font-size:.7rem;font-weight:800;background:rgba(0,0,0,.25);padding:3px 9px;border-radius:999px;vertical-align:middle;}
  .modal-sub{font-size:.8rem;font-weight:600;color:var(--muted);line-height:1.5;margin-bottom:12px;}
  .modal-close{
    position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);color:#fff;
    font-size:.95rem;font-weight:800;cursor:pointer;padding:0;line-height:1;font-family:var(--font);
  }
  .conj-table{width:100%;border-collapse:collapse;font-size:.85rem;}
  .conj-table th{
    text-align:left;padding:6px 8px;font-size:.66rem;font-weight:800;
    text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    border-bottom:2px solid rgba(255,255,255,.18);
  }
  .conj-table td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:700;}
  .conj-table td:first-child{color:var(--muted);font-weight:600;width:34%;}
  .conj-table td:last-child{text-align:right;color:#fff;}
  .conj-table .end-col{color:var(--gold);font-weight:800;text-align:center;}
  .confirm-text{font-size:.88rem;font-weight:600;line-height:1.5;margin-bottom:16px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions .gbtn{flex:1;font-size:.92rem;padding:13px 12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="hud-pill"><span class="hud-ico cup">🏆</span><span class="hud-val" id="hudBest">—</span></div>
    <div class="hud-spacer"></div>
    <div class="hud-pill"><span class="hud-ico">⭐</span><span class="hud-val" id="hudPoints">0</span></div>
  </div>
  <div id="app"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
/* ============ ОБЩЕЕ ============ */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function normalize(s){
  return (s || '').trim().toLowerCase().replace(/\s+/g,' ');
}

/* ============ ТЕМА: ГЛАГОЛЫ (данные) ============ */
const PERSON_LABEL = {
  "ja":"1 лицо ед.ч. (ja)",
  "ty":"2 лицо ед.ч. (ty)",
  "on/ona/ono":"3 лицо ед.ч. (on/ona/ono)",
  "my":"1 лицо мн.ч. (my)",
  "wy":"2 лицо мн.ч. (wy)",
  "oni/one":"3 лицо мн.ч. (oni/one)"
};
const PERSON_ORDER = ["ja","ty","on/ona/ono","my","wy","oni/one"];

const PARADIGMS = {
  "być":       ["jestem","jesteś","jest","jesteśmy","jesteście","są"],
  "mieć":      ["mam","masz","ma","mamy","macie","mają"],
  "mówić":     ["mówię","mówisz","mówi","mówimy","mówicie","mówią"],
  "czytać":    ["czytam","czytasz","czyta","czytamy","czytacie","czytają"],
  "pisać":     ["piszę","piszesz","pisze","piszemy","piszecie","piszą"],
  "robić":     ["robię","robisz","robi","robimy","robicie","robią"],
  "iść":       ["idę","idziesz","idzie","idziemy","idziecie","idą"],
  "jechać":    ["jadę","jedziesz","jedzie","jedziemy","jedziecie","jadą"],
  "jeść":      ["jem","jesz","je","jemy","jecie","jedzą"],
  "pić":       ["piję","pijesz","pije","pijemy","pijecie","piją"],
  "chcieć":    ["chcę","chcesz","chce","chcemy","chcecie","chcą"],
  "móc":       ["mogę","możesz","może","możemy","możecie","mogą"],
  "wiedzieć":  ["wiem","wiesz","wie","wiemy","wiecie","wiedzą"],
  "znać":      ["znam","znasz","zna","znamy","znacie","znają"],
  "mieszkać":  ["mieszkam","mieszkasz","mieszka","mieszkamy","mieszkacie","mieszkają"],
  "pracować":  ["pracuję","pracujesz","pracuje","pracujemy","pracujecie","pracują"],
  "uczyć się": ["uczę się","uczysz się","uczy się","uczymy się","uczycie się","uczą się"],
  "lubić":     ["lubię","lubisz","lubi","lubimy","lubicie","lubią"],

/* ============ ОЧКИ ============
   Точный ответ — 100 очков. Дальше — доля совпадения букв:
   считаем расстояние Левенштейна (сколько правок нужно, чтобы получить верный ответ)
   и переводим в проценты. Ни одной общей буквы → 0. */
const POINTS_PER_Q = 100;
const CLOSE_THRESHOLD = 0.6;   // от этого сходства ответ считается «почти»

function levenshtein(a, b){
  if(a === b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  let prev = Array.from({length:b.length+1}, (_, i) => i);
  const cur = new Array(b.length+1);
  for(let i = 1; i <= a.length; i++){
    cur[0] = i;
    for(let j = 1; j <= b.length; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(cur[j-1] + 1, prev[j] + 1, prev[j-1] + cost);
    }
    prev = cur.slice();
  }
  return prev[b.length];
}

function similarity(user, target){
  const a = normalize(user), b = normalize(target);
  if(!a && !b) return 1;
  if(!a || !b) return 0;
  if(a === b) return 1;
  return Math.max(0, 1 - levenshtein(a, b) / Math.max(a.length, b.length));
}

/* лучшее совпадение среди основного ответа и допустимых вариантов */
function gradeAnswer(q, value){
  let best = similarity(value, q.answer);
  (q.alt || []).forEach(a => { best = Math.max(best, similarity(value, a)); });
  const exact = best === 1;
  return {
    sim: best,
    points: Math.round(POINTS_PER_Q * best),
    exact,
    verdict: exact ? 'correct' : (best >= CLOSE_THRESHOLD ? 'close' : 'wrong')
  };
}

function subsSet(){
  return selectedSub ? new Set([selectedSub]) : null;
}
function currentPool(){
  return topic.questions(subsSet());
}
function maxTests(){
  return Math.max(1, Math.floor(currentPool().length / BATCH_SIZE));
}
function buildBatches(){
  const all = shuffle(currentPool());
  const batches = [];
  for(let i = 0; i < all.length; i += BATCH_SIZE) batches.push(all.slice(i, i + BATCH_SIZE));
  return batches.filter(b => b.length > 0);
}

function resetStats(){
  stats = {correct:0, wrong:0, total:0, points:0, maxPoints:0, byGroup:{}};
}
function bumpStat(key, exact){
  if(!stats.byGroup[key]) stats.byGroup[key] = {wrong:0, total:0};
  stats.byGroup[key].total++;
  if(!exact) stats.byGroup[key].wrong++;
}

function plural(n, one, few, many){
  const n10 = n % 10, n100 = n % 100;
  if(n10 === 1 && n100 !== 11) return one;
  if(n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
}

function syncHud(){
  const best = loadBest()[topic.id];
  hudBest.textContent = (best === undefined) ? '—' : best + '%';
  hudPoints.textContent = stats ? stats.points : 0;
}

function buildSwiper(slidesHtml, activeIndex, onChange){
  const dots = slidesHtml.map((_, i) =>
    `<div class="sw-dot${i === activeIndex ? ' active' : ''}"></div>`).join('');
  return {
    html: `
      <div class="swiper">
        ${slidesHtml.length > 1 ? '<button type="button" class="sw-arrow sw-prev">‹</button>' : ''}
        <div class="swiper-track">
          ${slidesHtml.map(s => `<div class="slide">${s}</div>`).join('')}
        </div>
        ${slidesHtml.length > 1 ? '<button type="button" class="sw-arrow sw-next">›</button>' : ''}
        ${slidesHtml.length > 1 ? `<div class="sw-dots">${dots}</div>` : ''}
      </div>`,
    init(root){
      const track = root.querySelector('.swiper-track');
      const dotEls = [...root.querySelectorAll('.sw-dot')];
      let idx = activeIndex;

      const width = () => track.clientWidth || 1;
      track.scrollLeft = idx * width();

      /* пересчитать активный слайд по текущей прокрутке */
      function settle(){
        if(!track.isConnected) return false;   // экран уже перерисован — не трогаем состояние
        const i = Math.round(track.scrollLeft / width());
        if(i !== idx && i >= 0 && i < slidesHtml.length){
          idx = i;
          dotEls.forEach((d, j) => d.classList.toggle('active', j === idx));
          onChange(idx);
          return true;
        }
        return false;
      }

      let timer;
      track.addEventListener('scroll', () => {
        clearTimeout(timer);
        timer = setTimeout(settle, 70);
      });
      /* где поддерживается — реагируем сразу по окончании прокрутки */
      if('onscrollend' in track) track.addEventListener('scrollend', settle);

      function go(i){
        i = Math.max(0, Math.min(slidesHtml.length - 1, i));
        track.scrollTo({left: i * width(), behavior:'smooth'});
      }
      const prev = root.querySelector('.sw-prev');
      const next = root.querySelector('.sw-next');
      if(prev) prev.addEventListener('click', () => go(idx - 1));
      if(next) next.addEventListener('click', () => go(idx + 1));
      window.addEventListener('resize', () => { track.scrollLeft = idx * width(); });

      return {settle};
    }
  };
}

/* ============ ЭКРАН ВЫБОРА ============ */
function renderSetup(){
  const topicSlides = TOPIC_ORDER.map(id => {
    const t = TOPICS[id];
    const n = t.questions(null).length;
    return `
      <div class="pick pick-topic pick-c-${t.color}">
        <div class="pick-emoji">${t.emoji}</div>
        <h2>${t.title}</h2>
        <p>${t.subtitle}</p>
        <div class="pick-count">${t.level} · ${n} ${plural(n,'вопрос','вопроса','вопросов')}</div>
      </div>`;
  });
  const topicSwiper = buildSwiper(topicSlides, TOPIC_ORDER.indexOf(topic.id), i => {
    topic = TOPICS[TOPIC_ORDER[i]];
    selectedSub = null;
    selectedCount = Math.min(3, maxTests());
    rebuildSubs();
    syncCount();
    syncHud();
  });

  app.innerHTML = `
    <div class="panel">
      <div class="panel-title">Тема · листай вбок</div>
      ${topicSwiper.html}
    </div>
    <div id="subsPanel"></div>
    <div class="panel">
      <div class="panel-title">Сколько тестов подряд</div>
      <div class="stepper">
        <button type="button" class="step-btn" id="stepDown">−</button>
        <div class="step-val" id="stepValue">${selectedCount}</div>
        <button type="button" class="step-btn" id="stepUp">+</button>
      </div>
      <div class="step-caption" id="stepCaption"></div>
    </div>
    <button type="button" class="gbtn g-green btn-xl" id="startBtn">ИГРАТЬ</button>
    <div class="step-caption" id="topicNote" style="margin-top:12px"></div>
  `;

  const topicCtl = topicSwiper.init(app.querySelector('.panel .swiper'));
  let subCtl = null;

  function rebuildSubs(){
    const holder = document.getElementById('subsPanel');
    if(!holder) return;
    if(!topic.subtopics){ holder.innerHTML = ''; return; }

    const items = [{id:null, label:'Всё подряд', caption:'вопросы из всех подтем', emoji:'🎲'}]
      .concat(topic.subtopics.map(s => ({...s, emoji: SUB_EMOJI[s.id] || '•'})));

    const slides = items.map(s => {
      const n = topic.questions(s.id ? new Set([s.id]) : null).length;
      return `
        <div class="pick pick-sub pick-c-blue">
          <div class="pick-emoji">${s.emoji}</div>
          <h2>${s.label}</h2>
          <p>${s.caption}</p>
          <div class="pick-count">${n} ${plural(n,'вопрос','вопроса','вопросов')}</div>
        </div>`;
    });

    const active = Math.max(0, items.findIndex(s => s.id === selectedSub));
    const sw = buildSwiper(slides, active, i => {
      selectedSub = items[i].id;
      selectedCount = Math.min(selectedCount, maxTests());
      syncCount();
    });
    holder.innerHTML = `<div class="panel"><div class="panel-title">Подтема · листай вбок</div>${sw.html}</div>`;
    subCtl = sw.init(holder.querySelector('.swiper'));
  }

  function syncCount(){
    if(!document.getElementById('stepValue')) return;
    const pool = currentPool().length;
    const max = maxTests();
    selectedCount = Math.max(1, Math.min(selectedCount, max));
    document.getElementById('stepValue').textContent = selectedCount;
    document.getElementById('stepDown').disabled = selectedCount <= 1;
    document.getElementById('stepUp').disabled = selectedCount >= max;
    document.getElementById('stepCaption').textContent =
      `по ${BATCH_SIZE} вопросов · максимум ${max} из ${pool} ${plural(pool,'вопроса','вопросов','вопросов')}`;
    document.getElementById('topicNote').textContent = topic.note;
  }

  document.getElementById('stepDown').addEventListener('click', () => { selectedCount--; syncCount(); });
  document.getElementById('stepUp').addEventListener('click', () => { selectedCount++; syncCount(); });
  document.getElementById('startBtn').addEventListener('click', () => {
    /* если палец только что отпустили, событие скролла могло не успеть дойти —
       досчитываем активные слайды прямо сейчас, чтобы стартовать то, что видно */
    topicCtl.settle();              // сменилась тема — подтемы уже перестроились
    if(subCtl) subCtl.settle();
    sessionBatches = buildBatches().slice(0, selectedCount);
    if(!sessionBatches.length) return;
    currentIndex = 0;
    resetStats();
    state = 'quiz';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  rebuildSubs();
  syncCount();
  syncHud();
}

/* ============ ЭКРАН ТЕСТА ============ */
function renderQuiz(){
  checked = false;
  const batch = sessionBatches[currentIndex];
  const donePct = Math.round(currentIndex / sessionBatches.length * 100);

  app.innerHTML = `
    <div class="quizbar">
      <div class="quizbar-label">Тест ${currentIndex+1}/${sessionBatches.length}</div>
      <div class="pbar"><div class="pbar-fill" id="pbarFill" style="width:${donePct}%"></div></div>
      <div class="quizbar-label" id="scoreLabel">0/${batch.length}</div>
    </div>
    <div class="grid" id="quiz"></div>
    <div class="result-banner" id="resultBanner"></div>
    <div class="actions">
      <button class="gbtn g-green" id="checkBtn">Проверить</button>
      <button class="gbtn g-amber" id="nextBtn" style="display:none">Дальше →</button>
      <button class="gbtn g-ghost" id="resetBtn" style="flex:0 0 42%">Выйти</button>
    </div>
  `;

  const quizEl = document.getElementById('quiz');
  batch.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (topic.blockInput ? ' block' : '');
    card.dataset.index = i;

    const parts = q.sentence.split('___');
    const field = `<input type="text" class="blank" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-i="${i}">`;

    card.innerHTML = `
      <div class="q-meta"><span>№${i+1}</span><span class="q-hint">${q.hint}</span></div>
      <div class="q-sentence">${
        topic.blockInput
          ? `${parts[0]}<span class="blank-gap"></span>${parts[1] || ''}${field}`
          : `${parts[0]}${field}${parts[1] || ''}`
      }</div>
      <div class="feedback" id="fb-${i}"></div>`;
    quizEl.appendChild(card);
  });

  quizEl.querySelectorAll('input.blank').forEach((inp, idx, arr) => {
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        e.preventDefault();
        if(idx+1 < arr.length) arr[idx+1].focus();
        else requestCheck();
      }
    });
  });
  quizEl.addEventListener('input', updateCount);
  updateCount();
  syncHud();

  document.getElementById('checkBtn').addEventListener('click', requestCheck);
  document.getElementById('resetBtn').addEventListener('click', () => {
    state = 'setup'; stats = null; render(); window.scrollTo({top:0, behavior:'smooth'});
  });
}

function updateCount(){
  if(checked) return;
  const inputs = document.querySelectorAll('#quiz input.blank');
  const label = document.getElementById('scoreLabel');
  let filled = 0;
  inputs.forEach(inp => { if(inp.value.trim() !== '') filled++; });
  if(label) label.textContent = `${filled}/${inputs.length}`;
}

function requestCheck(){
  const inputs = document.querySelectorAll('#quiz input.blank');
  let empty = 0;
  inputs.forEach(inp => { if(inp.value.trim() === '') empty++; });
  if(empty > 0) showConfirmModal(empty, inputs.length);
  else checkAnswers();
}

function showConfirmModal(empty, total){
  modalBox.innerHTML = `
    <button type="button" class="modal-close" id="modalCloseBtn">✕</button>
    <h3>Не всё заполнено</h3>
    <div class="confirm-text">Пусто: <b>${empty}</b> из <b>${total}</b>. Проверить сейчас? За пустые поля будет 0 очков.</div>
    <div class="confirm-actions">
      <button type="button" class="gbtn g-ghost" id="confirmBack">Вернуться</button>
      <button type="button" class="gbtn g-amber" id="confirmGo">Проверить</button>
    </div>`;
  modalBackdrop.classList.add('open');
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('confirmBack').addEventListener('click', closeModal);
  document.getElementById('confirmGo').addEventListener('click', () => { closeModal(); checkAnswers(); });
}

function checkAnswers(){
  const batch = sessionBatches[currentIndex];
  let exactCount = 0, batchPoints = 0;
  const batchMax = batch.length * POINTS_PER_Q;

  batch.forEach((q, i) => {
    const card = document.querySelector(`#quiz .card[data-index="${i}"]`);
    const input = card.querySelector('input.blank');
    const fb = document.getElementById(`fb-${i}`);
    card.classList.remove('correct','close','wrong');

    const r = gradeAnswer(q, input.value);
    card.classList.add(r.verdict);

    /* поле заменяем на блок с текстом: длинный ответ переносится и виден целиком */
    const given = document.createElement('div');
    given.className = 'given';
    given.textContent = input.value.trim() || '—';
    input.replaceWith(given);

    const badge = document.createElement('div');
    badge.className = 'pts ' + (r.exact ? 'full' : r.points > 0 ? 'part' : 'zero');
    badge.textContent = '+' + r.points;
    card.appendChild(badge);

    stats.total++;
    stats.points += r.points;
    stats.maxPoints += POINTS_PER_Q;
    batchPoints += r.points;
    bumpStat(q.g, r.exact);

    if(r.exact){
      exactCount++; stats.correct++;
      fb.innerHTML = '';
    } else {
      stats.wrong++;
      const icon = r.verdict === 'close' ? '≈' : '✕';
      const lead = r.verdict === 'close' ? '<b>Почти!</b> ' : '';
      fb.innerHTML = `<span class="icon">${icon}</span>${lead}${topic.wrongHtml(q)}`;
    }
  });

  checked = true;
  document.getElementById('scoreLabel').textContent = `${exactCount}/${batch.length}`;
  document.getElementById('pbarFill').style.width =
    Math.round((currentIndex + 1) / sessionBatches.length * 100) + '%';
  syncHud();

  const pct = Math.round(batchPoints / batchMax * 100);
  const banner = document.getElementById('resultBanner');
  banner.style.display = 'block';
  banner.className = 'result-banner ' + (pct >= 80 ? 'rb-great' : pct >= 50 ? 'rb-ok' : 'rb-low');
  banner.innerHTML = `Тест ${currentIndex+1}: <b>${batchPoints}</b> из ${batchMax} очков · точных ответов <b>${exactCount}/${batch.length}</b>`;

  document.getElementById('checkBtn').style.display = 'none';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  const isLast = currentIndex >= sessionBatches.length - 1;
  nextBtn.textContent = isLast ? 'Итоги →' : 'Дальше →';
  nextBtn.addEventListener('click', () => {
    if(isLast) state = 'summary'; else currentIndex++;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }, {once:true});

  document.querySelector('.quizbar').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ============ ИТОГИ ============ */
function renderSummary(){
  const pct = stats.maxPoints ? Math.round(stats.points / stats.maxPoints * 100) : 0;
  const starCount = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  const stars = [0,1,2].map(i => `<span class="star${i < starCount ? ' on' : ''}">★</span>`).join('');

  const best = loadBest();
  const isRecord = pct > (best[topic.id] ?? -1);
  if(isRecord){ best[topic.id] = pct; saveBest(best); }

  const rows = Object.keys(stats.byGroup)
    .filter(k => stats.byGroup[k].wrong > 0)
    .map(k => ({key:k, label:topic.groupLabel(k), wrong:stats.byGroup[k].wrong}))
    .sort((a,b) => b.wrong - a.wrong);
  const maxWrong = rows.length ? rows[0].wrong : 1;

  const breakdown = rows.length ? rows.map(r => `
    <div class="breakdown-row">
      <div class="breakdown-label">${r.label}</div>
      <div class="breakdown-track"><div class="breakdown-fill" style="width:${Math.round(r.wrong/maxWrong*100)}%"></div></div>
      <div class="breakdown-count">${r.wrong}</div>
    </div>`).join('')
    : `<div class="breakdown-row"><div class="breakdown-label">Ни одной ошибки 🎉</div></div>`;

  const advice = stats.wrong === 0
    ? `<li><span class="a-ico">🎉</span><span>Идеально! Бери больше тестов за раз или другую тему.</span></li>`
    : rows.slice(0, 2).map(r => topic.adviceHtml(r.key)).join('');

  app.innerHTML = `
    <div class="panel">
      <div class="score-hero">
        <div class="stars">${stars}</div>
        <div class="big-points">${stats.points}</div>
        <div class="big-points-cap">очков из ${stats.maxPoints}</div>
        <div class="score-line">
          <div class="score-chip">🎯 ${pct}%</div>
          <div class="score-chip">✓ точных ${stats.correct}/${stats.total}</div>
        </div>
        ${isRecord ? '<div class="best-flag">🏆 Новый рекорд!</div>' : ''}
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Ошибки по типам</div>
      ${breakdown}
    </div>
    <div class="panel">
      <div class="panel-title">Что подтянуть</div>
      <ul class="advice-list">${advice}</ul>
    </div>
    <div class="btn-row">
      <button type="button" class="gbtn g-green" id="againBtn">Ещё раз</button>
      <button type="button" class="gbtn g-blue" id="homeBtn">Сменить тему</button>
    </div>`;

  syncHud();
  document.getElementById('againBtn').addEventListener('click', () => {
    sessionBatches = buildBatches().slice(0, selectedCount);
    currentIndex = 0; resetStats(); state = 'quiz';
    render(); window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('homeBtn').addEventListener('click', () => {
    state = 'setup'; stats = null; render(); window.scrollTo({top:0, behavior:'smooth'});
  });
}

/* ============ МОДАЛ-ПОДСКАЗКА ============ */
document.addEventListener('click', e => {
  const link = e.target.closest('.ref-link');
  if(link){ openRefModal(link.dataset.ref); return; }
  if(e.target === modalBackdrop) closeModal();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function openRefModal(refKey){
  const r = topic.reference(refKey);
  if(!r) return;
  const head = `<tr>${r.cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
  const body = r.rows.map(row =>
    `<tr>${row.map((cell, i) => `<td${i === 1 && r.cols.length === 3 ? ' class="end-col"' : ''}>${cell}</td>`).join('')}</tr>`
  ).join('');
  modalBox.innerHTML = `
    <button type="button" class="modal-close" id="modalCloseBtn">✕</button>
    <h3>${r.title} ${r.tag ? `<span class="modal-tag">${r.tag}</span>` : ''}</h3>
    <div class="modal-sub">${r.sub}</div>
    <table class="conj-table">${head}${body}</table>`;
  modalBackdrop.classList.add('open');
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  modalBox.scrollTop = 0;
}
function closeModal(){ modalBackdrop.classList.remove('open'); }

/* ============ РОУТЕР ============ */
function render(){
  if(state === 'setup') renderSetup();
  else if(state === 'quiz') renderQuiz();
  else if(state === 'summary') renderSummary();
}

render();

/* ============ ЗАПРЕТ ЗУМА ============
   touch-action:manipulation в CSS убирает зум по двойному тапу, это — щипок в Safari. */
['gesturestart','gesturechange','gestureend'].forEach(ev => {
  document.addEventListener(ev, e => e.preventDefault(), {passive:false});
});

/* ============ PWA: офлайн-режим ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
